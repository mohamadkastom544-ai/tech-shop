
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تک شاپ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma;background:#f2f4f8;color:#222}
header{background:linear-gradient(135deg,#171738,#5148b8);color:white;text-align:center;padding:35px 15px}
header h1{font-size:36px}
nav{background:white;padding:18px;text-align:center}
nav a{margin:10px;color:#29245e;text-decoration:none;font-weight:bold}
.container{max-width:1000px;margin:25px auto;padding:15px}
.box{background:white;padding:25px;border-radius:15px;margin-bottom:25px}
input,textarea,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:9px;font-family:Tahoma}
button{background:#5148b8;color:white;border:0;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.product{background:white;padding:18px;border-radius:15px;text-align:center;box-shadow:0 3px 12px #ddd}
.product img{width:100%;height:150px;object-fit:contain}
.delete{background:#d94343}
footer{background:#171738;color:white;text-align:center;padding:25px;margin-top:40px}
</style>
</head>
<body>
<header>
<h1>تک شاپ</h1>
<p>دنیای خرید، فقط با یک کلیک!</p>
</header>
<nav>
<a href="#">صفحه اصلی</a>
<a href="#products">محصولات</a>
<a href="#add">افزودن محصول</a>
</nav>
<div class="container">
<div class="box">
<h2>به تک شاپ خوش آمدید</h2>
<p>در فروشگاه اینترنتی تک شاپ می‌توانید محصولات مختلف را معرفی کنید.</p>
</div>
<div class="box" id="add">
<h2>افزودن محصول جدید</h2>
<input id="name" placeholder="نام محصول">
<input id="price" type="number" placeholder="قیمت به تومان">
<input id="image" placeholder="آدرس تصویر محصول">
<textarea id="description" placeholder="توضیحات محصول"></textarea>
<button onclick="addProduct()">ثبت محصول</button>
</div>
<h2 id="products">محصولات فروشگاه</h2>
<div class="products" id="list"></div>
</div>
<footer>
<h3>تک شاپ</h3>
<p>یک تجربه متفاوت از خرید اینترنتی</p>
<p>طراحی شده برای پروژه مدرسه</p>
</footer>
<script>
let products=JSON.parse(localStorage.getItem("techshop"))||[];
function showProducts(){
let list=document.getElementById("list");
list.innerHTML="";
products.forEach((p,i)=>{
list.innerHTML+=`
<div class="product">
${p.image?`<img src="${p.image}" alt="محصول">`:""}
<h3>${p.name}</h3>
<p>${p.description}</p>
<strong>${Number(p.price).toLocaleString("fa-IR")} تومان</strong>
<button class="delete" onclick="deleteProduct(${i})">حذف محصول</button>
</div>`;
});
}
function addProduct(){
let name=document.getElementById("name").value.trim();
let price=document.getElementById("price").value;
let image=document.getElementById("image").value.trim();
let description=document.getElementById("description").value.trim();
if(!name||!price||Number(price)<=0){
alert("نام و قیمت معتبر وارد کنید");
return;
}
products.push({name,price,image,description});
localStorage.setItem("techshop",JSON.stringify(products));
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";
showProducts();
alert("محصول ثبت شد!");
}
function deleteProduct(i){
products.splice(i,1);
localStorage.setItem("techshop",JSON.stringify(products));
showProducts();
}
showProducts();
</script>
</body>
</html>
