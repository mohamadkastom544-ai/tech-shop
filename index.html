
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تک شاپ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4fa;font-family:Tahoma;color:#222}
header{background:linear-gradient(120deg,#171738,#6256d9);color:white;text-align:center;padding:30px 15px}
header h1{font-size:36px;margin:5px}
nav{background:white;padding:15px;text-align:center}
button{border:0;border-radius:9px;padding:12px 18px;background:#5148b8;color:white;cursor:pointer;font-family:Tahoma;margin:4px}
nav button{background:white;color:#5148b8;font-weight:bold}
.container{max-width:1000px;margin:25px auto;padding:15px}
.panel{background:white;border-radius:15px;padding:22px;margin-bottom:20px}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-family:Tahoma}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.product{background:white;padding:15px;border-radius:14px;text-align:center;box-shadow:0 3px 12px #ddd}
.product img{width:100%;height:160px;object-fit:contain}
.hidden{display:none}
.danger{background:#d94343}
footer{background:#171738;color:white;text-align:center;padding:25px;margin-top:40px}
</style>
</head>
<body>

<header>
<h1>تک شاپ</h1>
<p>دنیای خرید، فقط با یک کلیک!</p>
</header>

<nav>
<button onclick="showShop()">صفحه فروشگاه</button>
<button onclick="showLogin()">ورود مدیریت</button>
</nav>

<div class="container">

<section id="shop">
<div class="panel">
<h2>به تک شاپ خوش آمدید!</h2>
<p>محصولات مورد علاقه خود را در فروشگاه ما پیدا کنید.</p>
</div>
<h2>محصولات فروشگاه</h2>
<div class="products" id="productList"></div>
</section>

<section id="login" class="hidden">
<div class="panel">
<h2>ورود به مدیریت تک شاپ</h2>
<input id="password" type="password" placeholder="رمز عبور مدیریت">
<button onclick="login()">ورود</button>
<p id="message"></p>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>پنل مدیریت تک شاپ</h2>
<p>از این قسمت محصولات فروشگاه را مدیریت کنید.</p>
<input id="name" placeholder="نام محصول">
<input id="price" type="number" placeholder="قیمت محصول به تومان">
<input id="image" placeholder="آدرس تصویر محصول">
<textarea id="description" placeholder="توضیحات محصول"></textarea>
<button onclick="saveProduct()">ثبت محصول</button>
<button class="danger" onclick="logout()">خروج از مدیریت</button>
</div>
<h2>مدیریت محصولات</h2>
<div class="products" id="adminList"></div>
</section>

</div>

<footer>
<h3>تک شاپ</h3>
<p>یک تجربه متفاوت از خرید اینترنتی</p>
</footer>

<script>
const ADMIN_PASSWORD = "123456";
let products=JSON.parse(localStorage.getItem("techshop"))||[];
let editIndex=-1;

function save(){
localStorage.setItem("techshop",JSON.stringify(products));
}

function showShop(){
hideAll();
document.getElementById("shop").classList.remove("hidden");
renderShop();
}

function showLogin(){
hideAll();
document.getElementById("login").classList.remove("hidden");
}

function hideAll(){
["shop","login","admin"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
}

function login(){
let p=document.getElementById("password").value;
if(p===ADMIN_PASSWORD){
hideAll();
document.getElementById("admin").classList.remove("hidden");
renderAdmin();
}else{
document.getElementById("message").textContent="رمز عبور اشتباه است!";
}
}

function logout(){
document.getElementById("password").value="";
showShop();
}

function saveProduct(){
let name=document.getElementById("name").value.trim();
let price=document.getElementById("price").value;
let image=document.getElementById("image").value.trim();
let description=document.getElementById("description").value.trim();

if(!name||!price||Number(price)<=0){
alert("نام و قیمت معتبر وارد کنید");
return;
}

let item={name,price,image,description};

if(editIndex<0) products.push(item);
else products[editIndex]=item;

editIndex=-1;
save();

["name","price","image","description"].forEach(id=>{
document.getElementById(id).value="";
});

renderAdmin();
alert("محصول ثبت شد!");
}

function removeProduct(i){
if(confirm("این محصول حذف شود؟")){
products.splice(i,1);
save();
renderAdmin();
}
}

function editProduct(i){
let p=products[i];
document.getElementById("name").value=p.name;
document.getElementById("price").value=p.price;
document.getElementById("image").value=p.image;
document.getElementById("description").value=p.description;
editIndex=i;
window.scrollTo(0,0);
}

function card(p,i,admin){
return `
<div class="product">
${p.image?`<img src="${p.image}" alt="محصول">`:""}
<h3>${p.name}</h3>
<p>${p.description||""}</p>
<strong>${Number(p.price).toLocaleString("fa-IR")} تومان</strong>
${admin?`
<div>
<button onclick="editProduct(${i})">ویرایش</button>
<button class="danger" onclick="removeProduct(${i})">حذف</button>
</div>`:""}
</div>`;
}

function renderShop(){
document.getElementById("productList").innerHTML=
products.map((p,i)=>card(p,i,false)).join("");
}

function renderAdmin(){
document.getElementById("adminList").innerHTML=
products.map((p,i)=>card(p,i,true)).join("");
}

showShop();
</script>
</body>
</html>
